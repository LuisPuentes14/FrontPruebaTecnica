<br />
<br />
<p-button (click)="showDialog()" label="Agregar Materia" />

<div class="card flex justify-center">
  <a [routerLink]="['/list-students']" class="p-button font-bold">
    Volver a Estudiantes
  </a>
</div>
<br />
<br />
<div class="card">
  <p-table [value]="subjectsStudents" [tableStyle]="{ 'min-width': '60rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="idStudent" style="width: 20%">
          Id <p-sortIcon field="idStudentSubject" />
        </th>
        <th pSortableColumn="name" style="width: 20%">
          Nombre de Materia<p-sortIcon field="name" />
        </th>
        <th pSortableColumn="numberDocument" style="width: 20%">
          Nombre de Profesor <p-sortIcon field="numberDocument" />
        </th>
        <th pSortableColumn="numberDocument" style="width: 20%">
          Nombre de Estudiante <p-sortIcon field="numberDocument" />
        </th>
        <th pSortableColumn="creditProgramName" style="width: 20%">
          Acciones <p-sortIcon field="creditProgramName" />
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-subject>
      <tr>
        <td>{{ subject.idStudentSubject }}</td>
        <td>{{ subject.subjectName }}</td>
        <td>{{ subject.teacherName }}</td>
        <td>{{ subject.studentName }}</td>
        <td>

          <div class="card flex justify-center">
            <p-button label="Eliminar" icon="pi pi-trash" severity="danger"
              (onClick)="confirmarEliminacion(subject)"></p-button>
          </div>
          <p-button (click)="loadStudens(subject.subjectId)" label="Ver Comapeñeros" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog header="Agregar Materia" [(visible)]="visible" [style]="{ width: '25rem', height: '25rem' }">
  <form [formGroup]="subjectForm" (ngSubmit)="onSubmit()">
    <span class="p-text-secondary block mb-8">Update your information.</span>
    <br />
    <br />

    <div class="flex items-center gap-4 mb-8">
      <label for="selectedSubject" class="font-semibold w-24">Materia</label>
      <p-select formControlName="selectedSubject" [options]="subjects" optionLabel="name"
        placeholder="Seleccione programa" class="w-full md:w-56" />
    </div>
    <div *ngIf="
        subjectForm.get('selectedSubject')?.invalid &&
        subjectForm.get('selectedSubject')?.touched
      ">
      <small style="color: red">Seleccionar una materia es obligatorio</small>
    </div>

    <div class="flex justify-end gap-2">
      <p-button label="Cancel" severity="secondary" (click)="visible = false" />
      <p-button label="Save" type="submit" />
    </div>
  </form>
</p-dialog>

<p-dialog header="Lista de Compañeros" [(visible)]="visibleListStudents" [style]="{ width: '25rem', height: '25rem' }">
  <p-table [value]="listStudents" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #header>
      <tr>
        <th>Name</th>
      </tr>
    </ng-template>
    <ng-template #body let-student>
      <tr>
        <td>{{ student.studentName }}</td>
      </tr>
    </ng-template>
  </p-table>
</p-dialog>

<p-toast [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }" />
<!-- Diálogo de confirmación -->
<p-confirmDialog header="Confirmación" icon="pi pi-exclamation-triangle"></p-confirmDialog>
