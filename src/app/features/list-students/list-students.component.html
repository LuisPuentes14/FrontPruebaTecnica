
<div class="card flex justify-center">
  <button pButton pRipple severity="success">
      <WindowMaximizeIcon pButtonIcon />
      <span pButtonLabel>Agregar Estudiante</span>
  </button>
</div>
<br>
<div class="card">
  <p-table [value]="students" [tableStyle]="{'min-width': '60rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="idStudent" style="width:20%">
          Id <p-sortIcon field="idStudent" />
        </th>
        <th pSortableColumn="name" style="width:20%">
          Nombre <p-sortIcon field="name" />
        </th>
        <th pSortableColumn="numberDocument" style="width:20%">
          Número de documento <p-sortIcon field="numberDocument" />
        </th>
        <th pSortableColumn="creditProgramName" style="width:20%">
          Programa Académico <p-sortIcon field="creditProgramName" />
        </th>
        <th pSortableColumn="creditProgramName" style="width:20%">
          Acciones <p-sortIcon field="creditProgramName" />
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-student>
      <tr>
        <td>{{ student.idStudent }}</td>
        <td>{{ student.name }}</td>
        <td>{{ student.numberDocument }}</td>
        <td>{{ student.creditProgramName }}</td>
        <td>
          <div class="card flex justify-center">
            <a [routerLink]="['/list-subjects-students', student.idStudent]" class="p-button font-bold">
              Ver Materias
            </a>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

</div>
